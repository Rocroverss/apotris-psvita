# UNVERIFIED DRAFT: modeled on meson/switch.ini. Assumes VITASDK is
# installed and its env var points at the SDK root, same convention as
# vitasdk's own vita.toolchain.cmake. Adjust the path below if VITASDK
# isn't on the default location, and adjust flags as real build errors
# come up -- this has not been run against the actual toolchain yet.

[binaries]
c = '/usr/local/vitasdk/bin/arm-vita-eabi-gcc'
cpp = '/usr/local/vitasdk/bin/arm-vita-eabi-g++'
ar = '/usr/local/vitasdk/bin/arm-vita-eabi-ar'
strip = '/usr/local/vitasdk/bin/arm-vita-eabi-strip'

[built-in options]
c_args = [
    '-D__VITA__', '-DVITA',
    '-I/usr/local/vitasdk/arm-vita-eabi/include',
    '-mfloat-abi=softfp', '-Wl,-q',
]
c_link_args = [
    '-mfloat-abi=softfp', '-Wl,-q',
    '-L/usr/local/vitasdk/arm-vita-eabi/lib',
]
cpp_args = [
    '-D__VITA__', '-DVITA',
    '-I/usr/local/vitasdk/arm-vita-eabi/include',
    '-mfloat-abi=softfp', '-Wl,-q', '-std=gnu++20',
]
cpp_link_args = [
    '-mfloat-abi=softfp', '-Wl,-q',
    '-L/usr/local/vitasdk/arm-vita-eabi/lib',
]

[host_machine]
system = 'vita'
cpu_family = 'arm'
cpu = 'cortex-a9'
endian = 'little'

[target_machine]
system = 'vita'
cpu_family = 'arm'
cpu = 'cortex-a9'
endian = 'little'
