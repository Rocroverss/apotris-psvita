[binaries]
c = 'aarch64-linux-android21-clang'
cpp = 'aarch64-linux-android21-clang++'
ar = 'llvm-ar'
strip = 'llvm-strip'

[host_machine]
system = 'android'
cpu_family = 'aarch64'
cpu = 'aarch64'
endian = 'little'

[built-in options]
c_args = ['-fPIC']
cpp_args = ['-fPIC']
c_link_args = ['-lOpenSLES', '-llog', '-landroid', '-lGLESv2']
cpp_link_args = ['-lOpenSLES', '-llog', '-landroid', '-lGLESv2']
default_library = 'static'
b_staticpic = true

[properties]
# Users must ensure the NDK toolchain bin directory is in their PATH
needs_exe_wrapper = true

[sdl2:project options]
default_library = 'shared'
use_hidapi = 'disabled'

[sdl2_mixer:project options]
default_library = 'shared'
