[constants]
path = ''

[binaries]
c = 'x86_64-w64-mingw32-gcc'
cpp = 'x86_64-w64-mingw32-g++-posix'
objc = 'x86_64-w64-mingw32-gcc'
ar = 'x86_64-w64-mingw32-ar'
as = 'x86_64-w64-mingw32-as'
strip = 'x86_64-w64-mingw32-strip'
pkg-config = 'x86_64-w64-mingw32-pkg-config'
windres = 'x86_64-w64-mingw32-windres'
cmake = 'cmake'

[properties]
# Directory that contains 'bin', 'lib', etc
root = '/opt/homebrew'
# Directory that contains 'bin', 'lib', etc for the toolchain and system libraries
sys_root = '/opt/homebrew/opt/mingw-w64/toolchain-x86_64/x86_64-w64-mingw32'
pkg_config_path = '/opt/homebrew/opt/mingw-w64/toolchain-x86_64/x86_64-w64-mingw32/lib/pkgconfig'
pkg_config_libdir = '/opt/homebrew/opt/mingw-w64/toolchain-x86_64/x86_64-w64-mingw32/lib/pkgconfig'
needs_exe_wrapper = true
cmake_module_path = '/opt/homebrew/opt/mingw-w64/toolchain-x86_64/x86_64-w64-mingw32/lib/cmake/CURL'

[host_machine]
system = 'windows'
cpu_family = 'x86_64'
cpu = 'x86_64'
endian = 'little'

[cmake]
CMAKE_BUILD_WITH_INSTALL_RPATH     = 'ON'
CMAKE_FIND_ROOT_PATH_MODE_PROGRAM  = 'NEVER'
CMAKE_FIND_ROOT_PATH_MODE_LIBRARY  = 'ONLY'
CMAKE_FIND_ROOT_PATH_MODE_INCLUDE  = 'ONLY'
CMAKE_FIND_ROOT_PATH_MODE_PACKAGE  = 'ONLY'
